name: Build & Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - preview
          - production
      submit:
        description: "Submit to stores after build"
        required: false
        default: true
        type: boolean

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # ─── Lint & Type Check ───
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit

  # ─── iOS Build ───
  build-ios:
    name: Build iOS
    needs: quality
    if: >
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      - name: Build iOS
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive

  # ─── Android Build ───
  build-android:
    name: Build Android
    needs: quality
    if: >
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      - name: Build Android
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive

  # ─── Submit iOS to TestFlight ───
  submit-ios:
    name: Submit iOS to TestFlight
    needs: build-ios
    if: >
      github.event.inputs.submit == 'true' &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      - name: Submit to App Store Connect
        run: eas submit --platform ios --latest --non-interactive

  # ─── Submit Android to Google Play ───
  submit-android:
    name: Submit Android to Google Play
    needs: build-android
    if: >
      github.event.inputs.submit == 'true' &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      # The `ci` submit profile in eas.json points at this repo-relative path.
      # The `production` profile points at ~/.config/play on the maintainer's
      # machine, so the key never has to sit inside the working tree locally.
      - name: Write Google Play service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > ./google-service-account-key.json

      - name: Submit to Google Play (internal track)
        run: eas submit --platform android --latest --non-interactive --profile ci

  # ─── Notify ───
  notify:
    name: Send notification
    needs: [build-ios, build-android, submit-ios, submit-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify via IOTPush
        run: |
          IOS_BUILD="${{ needs.build-ios.result }}"
          ANDROID_BUILD="${{ needs.build-android.result }}"
          IOS_SUBMIT="${{ needs.submit-ios.result }}"
          ANDROID_SUBMIT="${{ needs.submit-android.result }}"

          # A job that did not run is "skipped", not a failure. The old condition
          # required BOTH platforms to be "success", so every single-platform
          # build -- the normal case, since platform is a dispatch input --
          # reported as an issue. An alert that is always red is an alert nobody
          # reads, which is worse than no alert.
          #
          # Fail only on an actual failure or cancellation.
          FAILED=""
          for pair in "iOS build:${IOS_BUILD}" "iOS submit:${IOS_SUBMIT}" \
                      "Android build:${ANDROID_BUILD}" "Android submit:${ANDROID_SUBMIT}"; do
            NAME="${pair%%:*}"
            RESULT="${pair##*:}"
            case "$RESULT" in
              success|skipped|"") ;;
              *) FAILED="${FAILED}${NAME} (${RESULT}); " ;;
            esac
          done

          # Report only what actually ran, so the message says something true
          # rather than listing three "skipped" for a one-platform build.
          RAN=""
          [ "$IOS_BUILD"      != "skipped" ] && RAN="${RAN}iOS build: ${IOS_BUILD}. "
          [ "$IOS_SUBMIT"     != "skipped" ] && RAN="${RAN}iOS submit: ${IOS_SUBMIT}. "
          [ "$ANDROID_BUILD"  != "skipped" ] && RAN="${RAN}Android build: ${ANDROID_BUILD}. "
          [ "$ANDROID_SUBMIT" != "skipped" ] && RAN="${RAN}Android submit: ${ANDROID_SUBMIT}. "

          if [ -z "$FAILED" ]; then
            TITLE="✅ Mobile build complete"
            MSG="${RAN}${{ github.ref_name }} @ ${GITHUB_SHA:0:7}"
            PRIORITY="normal"
          else
            TITLE="⚠️ Mobile build failed"
            MSG="Failed: ${FAILED}${RAN}${{ github.ref_name }} @ ${GITHUB_SHA:0:7}"
            PRIORITY="high"
          fi

          # Two things were wrong here and the notification has never arrived.
          #
          # 1. Apex. https://iotpush.com 307-redirects to www, and a 307 drops the
          #    POST body -- documented on /docs as the single most common
          #    integration issue, and this workflow was doing it to itself.
          # 2. The `claude` topic is private, so an unauthenticated POST is 401.
          #
          # IOTPUSH_API_KEY is an account API key (Settings -> API keys) with the
          # push:send scope. Without it this step degrades to a warning rather
          # than failing the run -- a missed notification must not fail a build
          # that otherwise succeeded.
          if [ -z "${{ secrets.IOTPUSH_API_KEY }}" ]; then
            echo "::warning::IOTPUSH_API_KEY is not set; skipping build notification."
            exit 0
          fi

          HTTP=$(curl -s -o /tmp/iotpush.out -w "%{http_code}" \
            -X POST "https://www.iotpush.com/api/push/claude" \
            -H "Authorization: Bearer ${{ secrets.IOTPUSH_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"${MSG}\", \"title\": \"${TITLE}\", \"priority\": \"${PRIORITY}\", \"tags\": \"ci,mobile\"}")

          # Report the outcome instead of swallowing it, which is how this went
          # unnoticed for so long.
          if [ "$HTTP" -ge 400 ]; then
            echo "::warning::iotpush notification failed (HTTP $HTTP): $(cat /tmp/iotpush.out)"
          else
            echo "Notification sent (HTTP $HTTP)."
          fi
