name: Build & Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - preview
          - production
      submit:
        description: "Submit to stores after build"
        required: false
        default: true
        type: boolean

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # ─── Lint & Type Check ───
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit

  # ─── iOS Build ───
  build-ios:
    name: Build iOS
    needs: quality
    if: >
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'ios'
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      # Capture the exact build id so the submit job pins this artifact instead
      # of guessing with --latest (which resubmits an already-uploaded binary
      # and fails with "build number N has already been used").
      - name: Build iOS
        id: build
        run: |
          BUILD_JSON=$(eas build --platform ios \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive --json --no-wait)
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id')
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          eas build:wait --id "$BUILD_ID"

  # ─── Android Build ───
  build-android:
    name: Build Android
    needs: quality
    if: >
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      - name: Build Android
        id: build
        run: |
          BUILD_JSON=$(eas build --platform android \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive --json --no-wait)
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id')
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          eas build:wait --id "$BUILD_ID"

  # ─── Submit iOS to TestFlight ───
  submit-ios:
    name: Submit iOS to TestFlight
    needs: build-ios
    if: >
      github.event.inputs.submit == 'true' &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      - name: Submit to App Store Connect
        run: |
          eas submit --platform ios \
            --id "${{ needs.build-ios.outputs.build-id }}" \
            --profile ci --non-interactive

  # ─── Submit Android to Google Play ───
  submit-android:
    name: Submit Android to Google Play
    needs: build-android
    if: >
      github.event.inputs.submit == 'true' &&
      (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      # The `ci` submit profile in eas.json points at this repo-relative path.
      # The `production` profile points at ~/.config/play on the maintainer's
      # machine, so the key never has to sit inside the working tree locally.
      - name: Write Google Play service account key
        env:
          PLAY_SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          printf '%s' "$PLAY_SA_KEY" > ./google-service-account-key.json
          jq -e '.client_email and .private_key' ./google-service-account-key.json > /dev/null \
            || { echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY is not a valid service account JSON"; exit 1; }

      - name: Submit to Google Play (internal track)
        run: |
          eas submit --platform android \
            --id "${{ needs.build-android.outputs.build-id }}" \
            --profile ci --non-interactive

  # ─── Notify ───
  notify:
    name: Send notification
    needs: [build-ios, build-android, submit-ios, submit-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify via IOTPush
        run: |
          IOS_BUILD="${{ needs.build-ios.result }}"
          ANDROID_BUILD="${{ needs.build-android.result }}"
          IOS_SUBMIT="${{ needs.submit-ios.result }}"
          ANDROID_SUBMIT="${{ needs.submit-android.result }}"

          if [ "$IOS_BUILD" = "success" ] && [ "$ANDROID_BUILD" = "success" ]; then
            TITLE="✅ Mobile builds complete"
            MSG="iOS build: ${IOS_BUILD}, submit: ${IOS_SUBMIT}. Android build: ${ANDROID_BUILD}, submit: ${ANDROID_SUBMIT}. Commit: ${{ github.sha }}"
            PRIORITY="normal"
          else
            TITLE="⚠️ Mobile build issue"
            MSG="iOS build: ${IOS_BUILD}, submit: ${IOS_SUBMIT}. Android build: ${ANDROID_BUILD}, submit: ${ANDROID_SUBMIT}. Commit: ${{ github.sha }}"
            PRIORITY="high"
          fi

          curl -s -X POST "https://iotpush.com/api/push/claude" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"${MSG}\", \"title\": \"${TITLE}\", \"priority\": \"${PRIORITY}\", \"tags\": \"ci,mobile\"}"
